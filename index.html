  <head>

    <!--
      Everything between these markers is route-specific and is regenerated for
      each route at build time by the prerender-seo plugin in vite.config.js,
      which reads the same copy as <Seo /> from src/utils/seo.ts. Do not hand-edit
      the values here for a single route — edit src/utils/seo.ts instead.
      The values below are the ones for "/".
    -->
    <!-- seo:start -->
    <title>Imam Bahri Alwi | Fullstack Developer</title>
    <meta
      name="description"
      content="Explore Imam Bahri Alwi&#39;s portfolio, projects, experience, certificates, and full-stack development work in React, Next.js, Node.js, and modern web applications."
    />
    <meta property="og:title" content="Imam Bahri Alwi | Fullstack Developer" />
    <meta
      property="og:description"
      content="Explore Imam Bahri Alwi&#39;s portfolio, projects, experience, certificates, and full-stack development work in React, Next.js, Node.js, and modern web applications."
    />
    <meta property="og:url" content="https://www.imambahri.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />
    <meta
      name="twitter:title"
      content="Imam Bahri Alwi | Fullstack Developer"
    />
    <meta
      name="twitter:description"
      content="Explore Imam Bahri Alwi&#39;s portfolio, projects, experience, certificates, and full-stack development work in React, Next.js, Node.js, and modern web applications."
    />
    <link rel="canonical" href="https://www.imambahri.com/" />
    <link rel="alternate" href="https://www.imambahri.com/en" hreflang="en" />
    <link rel="alternate" href="https://www.imambahri.com/id" hreflang="id" />
    <link
      rel="alternate"
      href="https://www.imambahri.com/"
      hreflang="x-default"
    />
    <!-- The JSON-LD graph is injected here per route at build time; in dev
         <Seo /> writes it on mount. -->
    <!-- seo:end -->

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-5HBQJYV8PG"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-5HBQJYV8PG");
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
